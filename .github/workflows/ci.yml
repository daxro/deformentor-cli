name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: deformentor-cli
          persist-credentials: false

      - name: Check out stockholm-freja
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: daxro/stockholm-freja
          path: stockholm-freja
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check
        working-directory: deformentor-cli

      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
        working-directory: deformentor-cli

      - name: Run tests
        run: uv run --locked --python "${{ matrix.python-version }}" pytest -q
        working-directory: deformentor-cli

      - name: Build package
        if: matrix.python-version == '3.14'
        run: uv build --no-sources
        working-directory: deformentor-cli

      - name: Verify built wheel
        if: matrix.python-version == '3.14'
        working-directory: deformentor-cli
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          stockholm_wheel="$(find ../stockholm-freja/dist -name '*.whl' -print -quit 2>/dev/null || true)"
          if [ -z "$stockholm_wheel" ]; then
            (cd ../stockholm-freja && uv build)
            stockholm_wheel="$(find ../stockholm-freja/dist -name '*.whl' -print -quit)"
          fi
          uv run --isolated --no-project --with "$stockholm_wheel" --with "$wheel" deformentor --version
          uv run --isolated --no-project --with "$stockholm_wheel" --with "$wheel" python -c \
            'from importlib.metadata import metadata, version; m = metadata("deformentor-cli"); assert version("deformentor-cli") == "0.2.0"; assert m["License-Expression"] == "MIT"; assert m["Project-URL"]'
          uv run --isolated --no-project python -c \
            'import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)' \
            "$wheel"
