name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deformentor-cli
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check
        working-directory: deformentor-cli

      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
        working-directory: deformentor-cli

      - name: Run tests
        run: uv run --locked --python "${{ matrix.python-version }}" pytest -q
        working-directory: deformentor-cli

      - name: Build package
        if: matrix.python-version == '3.14'
        run: uv build --no-sources
        working-directory: deformentor-cli

      - name: Verify built wheel
        if: matrix.python-version == '3.14'
        working-directory: deformentor-cli
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv run --isolated --no-project --with "$wheel" deformentor --version
          uv run --isolated --no-project --with "$wheel" python -c \
            'from importlib.metadata import metadata, version; m = metadata("deformentor-cli"); assert version("deformentor-cli") == "0.3.0"; assert m["License-Expression"] == "MIT"; assert m["Project-URL"]'
          uv run --isolated --no-project python -c \
            'import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)' \
            "$wheel"
