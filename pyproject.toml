[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "deformentor-cli"
version = "0.3.0"
description = "Unofficial agent-friendly CLI for authorized InfoMentor school data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.34.2",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.10.0",
    "stockholm-freja @ git+https://github.com/daxro/stockholm-freja.git@master",
    "portalocker>=3.0.0",
]

[project.scripts]
deformentor = "deformentor_cli.cli:main"
dfm = "deformentor_cli.cli:main"

[project.optional-dependencies]
completion = ["argcomplete>=3.7.0"]

[project.urls]
Homepage = "https://github.com/daxro/deformentor-cli"
Repository = "https://github.com/daxro/deformentor-cli"
Issues = "https://github.com/daxro/deformentor-cli/issues"
Security = "https://github.com/daxro/deformentor-cli/security/policy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
